# 複製此檔案為 secrets.yaml 並填入真實資料
# secrets.yaml 已被 .gitignore 排除，不會上傳 GitHub

deribit:
  client_id: "YOUR_DERIBIT_CLIENT_ID"
  client_secret: "YOUR_DERIBIT_CLIENT_SECRET"

telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_id: "YOUR_TELEGRAM_CHAT_ID"

server:
  # 本機開發：127.0.0.1（只有本機能連）
  # VPS 部署：0.0.0.0（所有介面，靠 ufw 限制只有 Tailscale 能通）
  host: "0.0.0.0"
  # Port 1312，VPS 上需搭配 ufw 設定 Tailscale-only 存取：
  #   sudo ufw deny 1312
  #   sudo ufw allow from 100.64.0.0/10 to any port 1312
  #   sudo ufw reload
  port: 1312
